apps(){const l=S.a;return `<h1>طلباتي</h1>`+(l.length?`<div class="grid">${l.map(a=>{const c=S.c.find(x=>x.id==a.cid);return `<div class="card"><h3><a href="#/c/${c.id}">${esc(c.t)}</a></h3><span class="st">${AST[a.s]}</span><p class="mut">أُرسل في ${fd(a.at)}</p>${a.s<5?`<button class="btn s sm" onclick="setApp(${a.id},6)">سحب الطلب</button>`:""}</div>`}).join("")}</div>`:`<div class="card empty"><h3>لا توجد طلبات تقديم حتى الآن.</h3><a class="btn" href="#/challenges">استكشف التحديات</a></div>`)},
saved(){const l=S.c.filter(c=>S.saved.includes(c.id));return `<h1>التحديات المحفوظة</h1>`+(l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="card empty"><h3>لا توجد تحديات محفوظة حتى الآن.</h3><a class="btn" href="#/challenges">استكشف التحديات</a></div>`)},
submit(){return `<h1>إرسال تحدٍ جديد</h1><p class="mut">سيُراجع فريق بريدج التحدي قبل نشره.</p><div class="card"><label>عنوان التحدي</label><input id="t"><label>اسم المؤسسة</label><input id="org"><label>المشكلة</label><textarea id="d" rows="4"></textarea><label>المخرجات المطلوبة</label><textarea id="dv" rows="2"></textarea><label>المهارات المطلوبة (افصل بينها بفاصلة)</label><input id="sk"><div class="filters"><div><label>المجال</label><select id="cat">${CATS.map((c,i)=>`<option value="${i}">${c}</option>`).join("")}</select></div><div><label>الصعوبة</label><select id="df">${DIFF.map((c,i)=>`<option value="${i}">${c}</option>`).join("")}</select></div><div><label>طريقة المشاركة</label><select id="m">${MODE.map((c,i)=>`<option value="${i}">${c}</option>`).join("")}</select></div><div><label>المدة (أسابيع)</label><input id="dur" type="number" value="6" min="2" max="16"></div><div><label>آخر موعد للتقديم</label><input id="dl" type="date"></div></div><button class="btn" onclick="sendC()">إرسال للمراجعة</button></div>`},
mine(){const l=S.c.filter(c=>S.mineIds&&S.mineIds.includes(c.id));return `<h1>تحدياتي</h1>`+(l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="card empty"><h3>لم ترسل أي تحدٍ بعد.</h3><a class="btn" href="#/submit">إرسال تحدٍ جديد</a></div>`)},
admin(){const rv=S.c.filter(c=>c.st=="review");return `<h1>لوحة الإدارة</h1><div class="stats"><div class="card"><b>${rv.length}</b>تحديات بانتظار المراجعة</div><div class="card"><b>${S.c.filter(c=>c.st=="open").length}</b>منشورة</div><div class="card"><b>${S.a.length}</b>طلبات تقديم</div></div>
<h2>مراجعة التحديات</h2>${rv.length?rv.map(c=>`<div class="card" style="margin-bottom:8px"><h3>${esc(c.t)}</h3><div class="mut">${esc(c.org)}</div><p>${esc(c.d)}</p><button class="btn sm" onclick="setC(${c.id},'open')">اعتماد ونشر</button> <button class="btn s sm" onclick="setC(${c.id},'rejected')">رفض</button></div>`).join(""):`<div class="card empty">لا توجد تحديات بانتظار المراجعة.</div>`}
<h2>طلبات التقديم</h2>${S.a.length?`<div class="card tbl"><table><tr><th>التحدي</th><th>المتقدم</th><th>الحالة</th></tr>${S.a.map(a=>`<tr><td>${esc(S.c.find(c=>c.id==a.cid).t)}</td><td>${esc(a.who)}</td><td><select onchange="setApp(${a.id},+this.value)">${AST.map((s,i)=>`<option value="${i}" ${a.s==i?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table></div>`:`<div class="card empty">لا توجد طلبات تقديم حتى الآن.</div>`}`}};
const nf=()=>`<div class="card empty"><h3>لا يمكن الوصول إلى هذه الصفحة.</h3><a class="btn" href="#/">العودة للرئيسية</a></div>`;
function setRole(r){S.role=r;save();route()}
function tog(id){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!=id):[...S.saved,id];save();route()}
function applyForm(id){$("#form").innerHTML=`<div class="card" style="margin-top:12px"><h3>التقديم على التحدي</h3><label>اسمك</label><input id="who"><label>لماذا ترغب في الانضمام إلى هذا التحدي؟</label><textarea id="why" rows="3"></textarea><label>ما المهارات التي يمكنك تقديمها؟</label><input id="sks"><label>رابط ملف أعمالك</label><input id="pf" class="ltr" dir="ltr" placeholder="https://"><label>ما مدى تفرغك خلال فترة المشروع؟</label><select id="av"><option>٥ ساعات أسبوعيًا</option><option>١٠ ساعات أسبوعيًا</option><option>١٥ ساعة أسبوعيًا أو أكثر</option></select><br><br><button class="btn" onclick="sendA(${id})">إرسال الطلب</button></div>`}
function sendA(id){const who=$("#who").value.trim(),why=$("#why").value.trim(),sk=$("#sks").value.trim();if(!who||!why||!sk)return toast("يرجى تعبئة جميع الحقول المطلوبة.");
S.a.push({id:++S.n,cid:id,who,why,s:0,at:new Date().toISOString()});save();toast("تم إرسال طلبك بنجاح.");location.hash="#/apps"}
function setApp(id,s){const a=S.a.find(x=>x.id==id);a.s=s;nt("تحديث على طلبك في «"+S.c.find(c=>c.id==a.cid).t+"»: "+AST[s]);if(s==4){mkP(a);nt("تم قبولك في الفريق.")}save();toast("تم تحديث حالة الطلب: "+AST[s]);route()}
function setC(id,s){S.c.find(c=>c.id==id).st=s;nt(s=="open"?"تم اعتماد تحديك ونشره.":"تم رفض تحديك.");save();toast(s=="open"?"تم اعتماد التحدي ونشره.":"تم رفض التحدي.");route()}
function sendC(){const g=i=>$("#"+i).value.trim();if(!g("t")||!g("org")||!g("d")||!g("dl")||!g("sk"))return toast("يرجى تعبئة جميع الحقول المطلوبة.");
const id=++S.n;S.c.push({id,t:g("t"),org:g("org"),cat:+g("cat"),sk:g("sk").split(/[,،]/).map(x=>x.trim()).filter(Boolean),dur:+g("dur")||6,df:+g("df"),m:+g("m"),dl:g("dl"),team:5,st:"review",pop:0,d:g("d"),dv:g("dv")||"سيحدَّد مع فريق بريدج"});(S.mineIds=S.mineIds||[]).push(id);save();toast("تم إرسال التحدي للمراجعة.");location.hash="#/mine"}
function route(){const h=(location.hash||"#/").slice(2).split("/"),p=h[0];nav();let x;
if(["submit","mine"].includes(p)&&S.role!="o")x=guard();else if(p=="admin"&&S.role!="a")x=guard();else if(["apps","saved"].includes(p)&&S.role!="v")x=guard();
else x=p==""?V.home():p=="challenges"?V.challenges():p=="c"?V.detail(h[1]):p=="verify"?V.verify(h[1]):p=="p"?V.ws(h[1]):V[p]?V[p]():nf();
$("#app").innerHTML=x;if(p=="challenges"){const u=()=>{S.q={s:$("#q").value,c:$("#f1").value,d:$("#f2").value,m:$("#f3").value,o:$("#f4").value};$("#res").innerHTML=V.cres()};["q","f1","f2","f3","f4"].forEach(i=>$("#"+i).oninput=u);u()}scrollTo(0,0)}
const guard=()=>`<div class="card empty"><h3>لا يمكن الوصول إلى هذه الصفحة.</h3><p class="mut">هذه الصفحة غير متاحة لدورك الحالي. بدّل الدور من القائمة العلوية.</p><a class="btn" href="#/">العودة للرئيسية</a></div>`;

const th=t=>{document.documentElement.dataset.theme=t;$("#thb").textContent=({light:"🌊",sunset:"🌅",night:"🌌"})[t]};th(S.theme||"light");
addEventListener("hashchange",route);route();
</script>
</body>
</html>
